    type: json
    data: |-
      {
        "name": "BCA Virtual Account",
        "code": "bca_va",
        "gateway": "manual",
        "is_active": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
