info:
  name: Admin Update Order Status
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{base_url}}/admin/orders/{{order_id}}/status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "status": "completed"
      }

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
