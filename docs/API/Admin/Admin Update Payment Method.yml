info:
  name: Admin Update Payment Method
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{base_url}}/admin/payment-methods/{{payment_method_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "is_active": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
