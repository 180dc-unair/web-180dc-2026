info:
  name: List Article Comments (Admin)
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/admin/article-comments"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
    - name: Data is array
      value: Array.isArray(res.body.data)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
