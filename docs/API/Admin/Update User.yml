info:
  name: Update User
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}/admin/users/{{user_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Admin Baru Updated",
        "role": "user"
      }

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
    - name: Name updated
      value: res.body.data.name == "Admin Baru Updated"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
