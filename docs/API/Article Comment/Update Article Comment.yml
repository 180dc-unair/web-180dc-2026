info:
  name: Update Article Comment
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/article-comments/{{article_comment_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "content": "Updated comment."
      }

runtime:
  assertions:
    - name: Status is successful
      value: res.status >= 200 && res.status < 300
    - name: Response is success
      value: res.body.status == "success"
    - name: Content updated
      value: res.body.data.content == "Updated comment."

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
