info:
  name: Create Article
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/articles"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "title": "Annual Impact Report",
        "excerpt": "Highlights from our latest impact report.",
        "content": "Full article content.",
        "status": "published"
      }

runtime:
  assertions:
    - name: Status is 201
      value: res.status == 201
    - name: Response is success
      value: res.body.status == "success"
    - name: Slug generated
      value: res.body.data.slug == "annual-impact-report"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
