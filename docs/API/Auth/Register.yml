info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Example",
        "username": "example",
        "email": "example@180dc.com",
        "password": "password",
        "password_confirmation": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
