info:
  name: Update Client
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/clients/{{client_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "PT Contoh Mitra Updated",
        "is_featured": true
      }

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
    - name: Name updated
      value: res.body.data.name == "PT Contoh Mitra Updated"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
