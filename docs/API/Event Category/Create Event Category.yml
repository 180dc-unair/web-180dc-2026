info:
  name: Create Event Category
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/event-categories"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Workshop",
        "slug": "workshop"
      }

runtime:
  assertions:
    - name: Status is 201
      value: res.status == 201
    - name: Status is success
      value: res.body.status == "success"
    - name: Name is correct
      value: res.body.data.name == "Workshop"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
