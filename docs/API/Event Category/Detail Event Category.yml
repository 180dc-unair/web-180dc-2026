info:
  name: Detail Event Category
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/event-categories/{{event_category_slug}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
    - name: Has slug
      value: res.body.data.slug != null

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
