info:
  name: Create Event
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/events"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "title": "Consulting Workshop 2026",
        "slug": "consulting-workshop-2026",
        "description": "Annual consulting workshop.",
        "location": "Jakarta",
        "start_at": "2026-03-15T09:00:00",
        "end_at": "2026-03-15T17:00:00",
        "status": "active",
        "price": 0,
        "is_paid": false,
        "is_featured": true
      }

runtime:
  assertions:
    - name: Status is 201
      value: res.status == 201
    - name: Status is success
      value: res.body.status == "success"
    - name: Title is correct
      value: res.body.data.title == "Consulting Workshop 2026"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
