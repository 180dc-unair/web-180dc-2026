info:
  name: Update Event
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/events/{{event_id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "title": "Consulting Workshop 2026 Updated",
        "is_featured": false
      }

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
    - name: Title updated
      value: res.body.data.title == "Consulting Workshop 2026 Updated"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
