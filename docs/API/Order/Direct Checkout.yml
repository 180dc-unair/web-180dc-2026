info:
  name: Direct Checkout
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/orders"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Idempotency-Key
      value: "{{$guid}}"
  body:
    type: json
    data: |-
      {
        "customer_name": "John Doe",
        "customer_email": "john@example.com",
        "items": [
          {
            "item_type": "product",
            "product_id": "{{product_id}}",
            "quantity": 1
          }
        ]
      }

runtime:
  assertions:
    - name: Status is 201
      value: res.status == 201
    - name: Status is success
      value: res.body.status == "success"
    - name: Items is array
      value: Array.isArray(res.body.data.items)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
