info:
  name: Create Payment
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/orders/{{order_id}}/payments"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "payment_method_code": "midtrans_va_bca"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
