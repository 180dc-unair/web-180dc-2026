info:
  name: List Payments by Order
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/orders/{{order_id}}/payments"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
