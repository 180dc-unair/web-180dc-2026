info:
  name: Upload Payment Proof
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/payments/{{payment_id}}/proof"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
    data:
      - name: proof
        type: file
        value:
          - /Users/nah/Downloads/ -3.jpg
        contentType: image/jpeg

runtime:
  assertions:
    - expression: ""
      operator: eq
      value: undefined res.status == 201
    - expression: ""
      operator: eq
      value: undefined res.body.data.proof.id != null

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
