info:
  name: Create Category
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/product-categories"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Digital Product",
        "sort_order": 1
      }

runtime:
  assertions:
    - expression: ""
      operator: eq
      value: undefined res.status == 201
    - expression: ""
      operator: eq
      value: undefined res.body.status == "success"
    - expression: ""
      operator: eq
      value: undefined res.body.data.name == "Digital Products"
    - expression: ""
      operator: eq
      value: undefined res.body.data.slug == "digital-products"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
