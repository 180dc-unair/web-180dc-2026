info:
  name: Search Categories
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/product-categories"
  headers:
    - name: Accept
      value: application/json
  params:
    query:
      - name: search
        value: digital

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
