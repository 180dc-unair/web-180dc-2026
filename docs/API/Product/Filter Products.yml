info:
  name: Filter Products
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/products"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: ""
      operator: eq
      value: undefined res.status == 200
    - expression: ""
      operator: eq
      value: undefined res.body.status == "success"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
