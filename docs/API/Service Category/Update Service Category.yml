info:
  name: Update Service Category
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/service-categories/{{service_category_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Digital Transformation Updated"
      }

runtime:
  assertions:
    - name: Status is successful
      value: res.status >= 200 && res.status < 300
    - name: Response is success
      value: res.body.status == "success"
    - name: Name updated
      value: res.body.data.name == "Digital Transformation Updated"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
