info:
  name: Detail Service
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/services/{{service_id}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
    - name: Has title
      value: res.body.data.title != null

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
