info:
  name: List Services
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/services"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
    - name: Data is array
      value: Array.isArray(res.body.data)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
