info:
  name: Create Team Member
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/team-members"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "name": "API Test Member",
        "slug": "api-test-member",
        "email": "api-test-member@example.com",
        "linkedin_url": "https://www.linkedin.com/in/api-test-member",
        "instagram_url": "https://instagram.com/api-test-member",
        "bio": "Member untuk smoke test API.",
        "is_active": true
      }

runtime:
  assertions:
    - name: Status is 201
      value: res.status == 201
    - name: Status is success
      value: res.body.status == "success"
    - name: Name is correct
      value: res.body.data.name == "API Test Member"
    - name: Slug is correct
      value: res.body.data.slug == "api-test-member"
