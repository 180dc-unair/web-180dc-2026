info:
  name: Delete Team Member
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{base_url}}/team-members/{{team_member_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
