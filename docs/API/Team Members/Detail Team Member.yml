info:
  name: Detail Team Member
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/team-members/{{team_member_id}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - name: Status is 200
      value: res.status == 200
    - name: Status is success
      value: res.body.status == "success"
    - name: Has member id
      value: res.body.data.id != null
